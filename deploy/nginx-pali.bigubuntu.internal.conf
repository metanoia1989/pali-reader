# ============================================================================
#  巴利三藏阅读器 —— pali.bigubuntu.internal
# ----------------------------------------------------------------------------
#  本文件内容 = 面板【网站 → pali.bigubuntu.internal → 伪静态】输入框。
#  被站点 vhost 的
#      include /www/server/panel/vhost/rewrite/pali.bigubuntu.internal.conf;
#  引入到 server 块内，所以这里可以写 location。
#
#  三部分：
#    1) /api/    → 本机宝塔 Go 项目 pali_reading（127.0.0.1:8090，未放行防火墙）
#    2) SPA 回退 → vue-router history 模式，刷新非根路径不 404
#    3) 缓存策略 → 构建产物长缓存 / index.html 不缓存
#
#  ⚠️ 别在面板里套用「伪静态」预设模板（WordPress / ThinkPHP 等），会整段覆盖本文件。
# ============================================================================

# --- 1. 后端 API 反向代理 ---------------------------------------------------
# ^~ 前缀：命中后跳过 vhost 里的正则 location，避免 API 路径被
#          「禁止访问的敏感文件」或 .js/.css 缓存规则误伤。
# proxy_pass 不带 URI 部分 → /api/xxx 原样透传给后端。
location ^~ /api/ {
    proxy_pass         http://127.0.0.1:8091;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # 一章经文的响应可达数百 KB，读超时给足。
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # 阅读器的段落与词条响应是可缓存的只读内容，允许浏览器短缓存，
    # 但用户自己的批注必须每次回源，所以整体不缓存、只放行压缩。
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
}

# --- 2. SPA 前端路由回退 ----------------------------------------------------
location / {
    try_files $uri $uri/ /index.html;
}

# --- 3. 缓存策略 ------------------------------------------------------------
# ^~ 必须加：vhost 自带 location ~ .*\.(js|css)?$ 是正则，优先级高于普通前缀，
# 不加 ^~ 的话下面的 immutable 对 .js/.css 根本不生效。
# 产物文件名带内容哈希，改了名就是新 URL，可以放心长缓存。
location ^~ /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# index.html 不能缓存，否则发版后客户端仍指向已删除的旧 assets
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}
